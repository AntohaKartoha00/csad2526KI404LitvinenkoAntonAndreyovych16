name: Cross-platform Build
on:
  push:
    branches: ['develop', 'master']
  pull_request:
    branches: ['develop', 'master']
jobs:
  cross_build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
   
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false
          # Видалено submodules: recursive — бо vcpkg не налаштований
         
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2.0.0
        with:
          cmake-version: '3.27'
       
      # Розділені кроки для фіксу скриптів
      - name: Fix script for Linux/macOS
        if: runner.os != 'Windows'
        run: |
          if [ -f "ci.sh" ]; then
            chmod +x ci.sh
            dos2unix ci.sh 2>/dev/null || true
            echo "Linux/macOS script prepared"
          else
            echo "Warning: ci.sh not found"
          fi
      
      - name: Check Windows script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (Test-Path "ci.bat") {
            Write-Output "Windows script found"
          } else {
            Write-Output "Warning: ci.bat not found"
          }
       
      # Розділені кроки для чистки build
      - name: Clean previous build (Linux/macOS)
        if: runner.os != 'Windows'
        run: rm -rf build
      
      - name: Clean previous build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: if (Test-Path build) { Remove-Item -Recurse -Force build }
       
      - name: Build and Test (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: ./ci.sh
       
      - name: Build and Test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: ci.bat
       
      - name: Build Success Message
        if: success()
        run: echo "✅ Build succeeded"
       
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.os }}
          path: build/