name: Cross-platform Build

on:
  push:
    branches:
      - '*develop*'
      - '*master*'
  pull_request:
    branches:
      - '*develop*'
      - '*master*'

jobs:
  cross_build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2.0.0
        with:
          cmake-version: '3.27'
      
      - name: Make script executable (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x ci.sh
      
      - name: Build and Test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: ./ci.sh
      
      - name: Build and Test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: ./ci.bat
      
      - name: Build Success Message
        if: success()
        run: echo "✅ Build succeeded"
      
      - name: Deploy
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.os }}
          path: build/